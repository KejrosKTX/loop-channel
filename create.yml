name: Create loop video

on:
  schedule:
    - cron: "0 6 * * 1,3,5"   # Mon, Wed, Fri 06:00 UTC - edit freely
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick test (tiny, 1 minute long, finishes in minutes)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          if grep -q '"video_source": "manual_ai"' config.json; then
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          else
            sudo apt-get install -y -qq blender ffmpeg fonts-dejavu-core
          fi
          pip install requests pillow

      - name: Create video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          QUICK: ${{ github.event_name == 'workflow_dispatch' && inputs.quick }}
        run: python pipeline.py create

      - name: Save state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "loop-bot"
            git config user.email "loop-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || { git commit -m "state" && git pull --rebase && git push; }
          fi
