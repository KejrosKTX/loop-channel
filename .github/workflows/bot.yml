name: Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      new_prompt:
        description: "Generate a new prompt right now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install requests

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.new_prompt }}
        run: python pipeline.py tick

      - name: Save state
        if: always()
        run: |
          if [ -f bot_state.json ]; then
            git config user.name "loop-bot"
            git config user.email "loop-bot@users.noreply.github.com"
            git add bot_state.json
            git diff --cached --quiet || { git commit -m "state" && git pull --rebase && git push; }
          fi
