name: Telegram inbox

# Needed for: (a) the "manual_ai" video source (you send the AI clip to the bot)
#             (b) /approve and /reject (YouTube API publishing)
# Turn it on by removing the two "#" in front of the schedule lines below.
# Use a PUBLIC repo (unlimited free Actions minutes) - a private repo would run out.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install requests pillow google-api-python-client google-auth

      - name: Check Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python pipeline.py poll

      - name: Save state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "loop-bot"
            git config user.email "loop-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || { git commit -m "state" && git pull --rebase && git push; }
          fi
